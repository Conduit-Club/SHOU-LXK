<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Set the saved theme before styles and content can paint.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("lxk-theme") === "light" ? "light" : "dark";
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-code="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
